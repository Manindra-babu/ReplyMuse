version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: replymuse-db
    restart: always
    environment:
      POSTGRES_USER: replymuse
      POSTGRES_PASSWORD: replymuse_secret_password
      POSTGRES_DB: replymuse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: replymuse-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://replymuse:replymuse_secret_password@db:5432/replymuse
      - SYNC_DATABASE_URL=postgresql://replymuse:replymuse_secret_password@db:5432/replymuse
      - SECRET_KEY=production_secret_key_minimum_32_characters_long_for_security
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6JTrbUlNzJKJdCdxg_sDSjTqgrnhNPrNIQ5afkq4T1sPw}
      - GEMINI_MODEL=gemini-1.5-flash
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: replymuse-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:

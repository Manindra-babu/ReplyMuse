<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReplyMuse — Every reply, in your voice</title>
    <meta
      name="description"
      content="ReplyMuse is an AI review reply studio that writes authentic responses to Google reviews for local cafes, restaurants, and small businesses in seconds."
    />
    <meta name="theme-color" content="#F7F3E8" />
    <link rel="canonical" href="https://replymuse.com/" />

    <!-- Preload Hero LCP Image -->
    <link rel="preload" as="image" href="/images/hero-cafe-reply.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://replymuse.com/" />
    <meta property="og:title" content="ReplyMuse — Every reply, in your voice" />
    <meta
      property="og:description"
      content="AI-written replies to Google reviews that sound like you. Turn customer feedback into repeat guests while preserving your authentic voice."
    />
    <meta property="og:image" content="https://replymuse.com/images/hero-cafe-reply.png" />
    <meta property="og:image:width" content="1644" />
    <meta property="og:image:height" content="957" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://replymuse.com/" />
    <meta name="twitter:title" content="ReplyMuse — Every reply, in your voice" />
    <meta
      name="twitter:description"
      content="AI-written replies to Google reviews that sound like you. Turn customer feedback into repeat guests while preserving your authentic voice."
    />
    <meta name="twitter:image" content="https://replymuse.com/images/hero-cafe-reply.png" />

    <!-- Typography: Google Fonts Newsreader (editorial serif) & Plus Jakarta Sans (interface sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F7F3E8] text-[#2B2B2B] font-sans antialiased selection:bg-[#DCEBE3] selection:text-[#1F7A5C] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
